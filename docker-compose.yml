# ─────────────────────────────────────────────────────────────────────────────
# HerdLink — local development infrastructure
#
# What's here: stateful infra (databases, brokers, observability) plus the
# NestJS device-service and Vite dashboard-ui for local development.
#
# Quickstart:
#   docker compose up                # start everything
#   docker compose up -d             # start in background
#   docker compose ps                # see what's running and healthy
#   docker compose down              # stop, keep volumes (data persists)
#   docker compose down -v           # stop, wipe volumes (clean slate)
#   docker compose logs -f kafka     # tail logs for one service
#
# Host ports map to convention defaults — no surprises:
#   5432  PostgreSQL/Timescale
#   27017 MongoDB
#   6379  Redis
#   9092  Kafka (external)
#   8081  Schema Registry
#   1883  MQTT
#   9090  Prometheus
#   3000  dashboard-ui (Vite on host → 5173 in container)
#   3001  Grafana
#   16686 Jaeger UI
#   4317  Jaeger OTLP gRPC
#   4318  Jaeger OTLP HTTP
#   8080  Kafka UI
#   3002  device-service (NestJS on host → 3000 in container)
#   8082  mongo-express
#   8083  pgAdmin
# ─────────────────────────────────────────────────────────────────────────────

name: herdlink

networks:
  herdlink:
    driver: bridge

volumes:
  device-service-node-modules:
  dashboard-ui-node-modules:
  timescale-data:
  mongo-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  jaeger-data: 
  pgadmin-data:
  mosquitto-data:
  mosquitto-log:

services:

  # ─── DATA STORES ────────────────────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: herdlink-timescale
    restart: unless-stopped
    networks: [herdlink]
    ports:
      - "5430:5432"
    environment:
      POSTGRES_USER: herdlink
      POSTGRES_PASSWORD: herdlink_dev
      POSTGRES_DB: herdlink
    volumes:
      - timescale-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herdlink -d herdlink"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:8
    container_name: herdlink-mongo
    restart: unless-stopped
    networks: [herdlink]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: herdlink
      MONGO_INITDB_ROOT_PASSWORD: herdlink_dev
      MONGO_INITDB_DATABASE: herdlink
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

