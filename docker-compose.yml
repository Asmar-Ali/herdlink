  # ─── APPLICATION ────────────────────────────────────────────────────────────

  device-service:
    build:
      # Monorepo root — package.json uses file:../../libs/{auth,observability}
      context: .
      dockerfile: apps/device-service/Dockerfile
    image: herdlink-device:local
    container_name: herdlink-device
    restart: unless-stopped
    networks: [herdlink]
    ports:
      # Host 3002 avoids clashing with a local Nest/other app on 3000
      - "3002:3000"
    working_dir: /workspace/apps/device-service
    command: ["npm", "run", "start:dev"]
    volumes:
      # Preserve ../../libs relative to working_dir for file: deps + live reload
      - ./apps/device-service:/workspace/apps/device-service
      - ./libs:/workspace/libs
      - device-service-node-modules:/workspace/apps/device-service/node_modules
    environment:
      PORT: "3000"
      NODE_ENV: development
      # Ready when you wire TypeORM / Mongoose (Docker DNS hostnames)
      MONGODB_URI: mongodb://herdlink:herdlink_dev@mongodb:27017/herdlink?authSource=admin
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: herdlink
      POSTGRES_PASSWORD: herdlink_dev
      POSTGRES_DB: herdlink
      SEED_DEVICES: "true"
      SEED_DEVICE_COUNT: "1000"
      # Dev-only shared secret. Every service that verifies or issues JWTs
      # uses this same value — see docs/adr for the shared-secret rationale.
      JWT_SECRET: herdlink_dev_jwt_secret_change_me
    depends_on:
      mongodb:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  dashboard-ui:
    build:
      context: ./apps/dashboard-ui
      dockerfile: Dockerfile
    image: herdlink-dashboard-ui:local
    container_name: herdlink-dashboard-ui
    restart: unless-stopped
    networks: [herdlink]
    ports:
      # Host 3000 — reserved for the SPA; Vite listens on 5173 in-container
      - "3000:5173"
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./apps/dashboard-ui:/app
      - dashboard-ui-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      # Vite proxies /api → device-service over the compose network (see
      # apps/dashboard-ui/vite.config.ts). This is how the login flow reaches
      # the backend without CORS.
      VITE_API_PROXY_TARGET: http://device-service:3000
    depends_on:
      - device-service

