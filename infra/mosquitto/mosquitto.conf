# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto config for HerdLink local development.
# Allows anonymous connections — fine for local dev, NEVER for production.
# ─────────────────────────────────────────────────────────────────────────────

# Default MQTT listener
listener 1883
protocol mqtt

# Optional: MQTT over WebSockets (useful for browser-based debugging clients)
listener 9001
protocol websockets

# No auth — local development only
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits — more than enough for 1,000 simulated devices
max_connections -1
max_inflight_messages 100
max_queued_messages 1000